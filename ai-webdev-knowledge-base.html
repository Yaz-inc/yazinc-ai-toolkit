  return <span className={`inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-medium ring-1 ${className}`}>{children}</span>;
}

  const curated = source === "Curated";

              ))}
            </div>
            <div className="grid md:grid-cols-3 gap-4">
              {[
                { t:"Knowledge Base", d:"Every project as a searchable, filterable card with its tech stack and a direct link to the source code.", tab:"projects", c:"from-sky-500/10 to-transparent" },
                { t:"Tools & Libraries", d:"The open-source stack behind the builds — React, Tailwind, Puter.js — plus curated data/automation tools.", tab:"tools", c:"from-fuchsia-500/10 to-transparent" },
                { t:"Playbook", d:"Use-case recipes: what to reach for and which starter to fork when building your next app.", tab:"playbook", c:"from-emerald-500/10 to-transparent" },
              ].map(card => (
                <button key={card.t} onClick={()=>setTab(card.tab)}
                  className={`text-left rounded-2xl border border-slate-800 bg-gradient-to-b ${card.c} p-5 hover:border-slate-600 transition-all`}>
                  <h3 className="font-semibold text-white mb-1.5">{card.t}</h3>
                  <p className="text-sm text-slate-400">{card.d}</p>
                </button>
              ))}
            </div>
            <div className="rounded-xl border border-amber-500/20 bg-amber-500/5 p-4 flex gap-3">
              <span className="text-amber-400 mt-0.5">{Icons.info}</span>
              <p className="text-sm text-slate-300">
                <b className="text-amber-300">On sourcing:</b> Items tagged <SourceTag source="How to Web Dev" /> come from the channel's public
                GitHub (github.com/HowtoWebDev) and video catalogue. Items tagged <SourceTag source="Curated" /> were added to round out your
                data &amp; automation focus and are <b>not</b> from the channel. Your private TikTok saves couldn't be accessed directly — see the
                <button onClick={()=>setTab("add")} className="text-sky-400 hover:text-sky-300 underline mx-1">Add Your Own</button> tab to fold them in.
              </p>
            </div>
          </div>
        )}

        {/* PROJECTS */}
        {tab === "projects" && (
          <div className="fade-in space-y-5">
            <div>
              <h2 className="text-2xl font-bold text-white">Knowledge Base</h2>
              <p className="text-slate-400 text-sm mt-1">{filtered.length} of {PROJECTS.length} projects. Each links to its open-source repo.</p>
            </div>
            <div className="flex flex-col sm:flex-row gap-3">
              <div className="relative flex-1">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">{Icons.search}</span>
                <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search projects, tech, keywords…"
                  className="w-full pl-10 pr-4 py-2.5 rounded-lg bg-slate-900 border border-slate-800 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-600" />
              </div>
              <div className="flex flex-wrap gap-1.5">
                {CATEGORIES.map(c => (
                  <button key={c} onClick={()=>setCat(c)}
                    className={`px-3 py-2 rounded-lg text-xs font-medium transition-colors ${cat===c ? "bg-sky-500/15 text-sky-300 ring-1 ring-sky-500/30" : "bg-slate-900 text-slate-400 hover:text-white border border-slate-800"}`}>{c}</button>
                ))}
              </div>
            </div>
            <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">
              {filtered.map(p => <ProjectCard key={p.id} p={p} />)}
            </div>
            {!filtered.length && <p className="text-center text-slate-500 py-12">No projects match your search.</p>}
          </div>
        )}

        {/* TOOLS */}
        {tab === "tools" && (
          <div className="fade-in space-y-5">
            <div>
              <h2 className="text-2xl font-bold text-white">Tools &amp; Libraries</h2>
              <p className="text-slate-400 text-sm mt-1">The open-source stack behind the builds, plus curated data &amp; automation additions.</p>
            </div>
            <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">
              {TOOLS.map(t => <ToolCard key={t.id} t={t} />)}
            </div>
          </div>
        )}

        {/* PLAYBOOK */}
        {tab === "playbook" && (
          <div className="fade-in space-y-5">
            <div>
              <h2 className="text-2xl font-bold text-white">Playbook</h2>
              <p className="text-slate-400 text-sm mt-1">Scenario-based recipes for building your future applications — what to reach for and where to start.</p>
            </div>
            <div className="grid lg:grid-cols-2 gap-4">
              {PLAYS.map(pl => <PlayCard key={pl.id} play={pl} />)}
            </div>
          </div>
        )}

        {/* ADD YOUR OWN */}
        {tab === "add" && (
          <div className="fade-in space-y-5 max-w-2xl">
            <div>
              <h2 className="text-2xl font-bold text-white">Add Your Own Resources</h2>
              <p className="text-slate-400 text-sm mt-1">Fold in your TikTok saves and any other finds. Two easy ways:</p>
            </div>
            <div className="rounded-2xl border border-slate-800 bg-slate-900/50 p-6 space-y-4">
              <div>
                <h3 className="font-semibold text-white mb-1">Option 1 — Send me the list</h3>
                <p className="text-sm text-slate-400">Export your TikTok data (Profile → Settings → Account → Download your data) or paste your saved links into the chat. I'll parse them and regenerate this file with your resources merged in and categorized.</p>
              </div>
              <div className="border-t border-slate-800 pt-4">
                <h3 className="font-semibold text-white mb-1">Option 2 — Edit this file directly</h3>
                <p className="text-sm text-slate-400 mb-2">Open this HTML file in any editor and add entries to the <code className="font-mono text-sky-300 bg-slate-800 px-1 rounded">PROJECTS</code> or <code className="font-mono text-sky-300 bg-slate-800 px-1 rounded">TOOLS</code> array near the top. Copy this template:</p>
                <pre className="font-mono text-xs bg-slate-950 border border-slate-800 rounded-lg p-3 overflow-x-auto text-slate-300">{`{ id:"my-tool", name:"Tool name",
  desc:"What it does.",
  cat:"AI", url:"https://...",
  source:"Curated" },`}</pre>
              </div>
            </div>
            <div className="rounded-xl border border-slate-800 bg-slate-900/40 p-4 text-sm text-slate-400">
              Tip: this file is self-contained — you can keep it on your desktop, host it on <a href="https://www.yaz-inc.com" target="_blank" rel="noopener noreferrer" className="text-sky-400 hover:text-sky-300">yaz-inc.com</a>, or drop it in any static host. It only needs an internet connection to load the CDN scripts.
            </div>
          </div>
        )}

        <footer className="mt-12 pt-6 border-t border-slate-800 text-xs text-slate-600">
          Built as a living knowledge base • Links open the original open-source repos and docs • Verify tools before use in production.
        </footer>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
